jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          cd cmp
          ./gradlew :androidApp:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: LionVPN-APK
          path: cmp/androidApp/build/outputs/apk/release/*.apk
          
