name: Build Lion VPN APK

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:  # این رو حتماً بذارید تا بتونید دستی هم اجراش کنید

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🧰 Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔧 Grant execute permission to gradlew
        run: chmod +x cmp/gradlew

      - name: 🏗️ Build Release APK
        run: |
          cd cmp
          ./gradlew :androidApp:assembleRelease --no-daemon

      - name: 📦 Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: LionVPN-Release-APK
          path: cmp/androidApp/build/outputs/apk/release/*.apk
